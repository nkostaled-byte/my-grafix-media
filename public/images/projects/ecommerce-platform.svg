<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#FAFAFA"/>

  <!-- Browser Window -->
  <g transform="translate(100, 100)">
    <!-- Window Chrome -->
    <rect width="1400" height="800" rx="12" fill="white" stroke="#E5E5E5" stroke-width="2"/>
    <rect width="1400" height="40" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="2"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="20" r="6" fill="#28CA42"/>

    <!-- Address Bar -->
    <rect x="90" y="12" width="1220" height="16" rx="8" fill="white" stroke="#E5E5E5" stroke-width="1"/>
    <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#737373">
      https://shop.example.com
    </text>

    <!-- E-commerce Interface -->
    <g transform="translate(0, 50)">
      <!-- Header with Cart -->
      <rect width="1400" height="60" fill="white"/>
      <text x="50" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
        STORE
      </text>

      <!-- Cart Icon -->
      <g transform="translate(1320, 20)">
        <circle cx="10" cy="10" r="4" fill="#0F0F0F"/>
        <text x="18" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F0F0F">
          3
        </text>
      </g>

      <!-- Product Grid -->
      <g transform="translate(50, 100)">
        <!-- Product 1 -->
        <g>
          <rect width="320" height="320" rx="8" fill="#F5F5F5"/>
          <rect y="330" width="320" height="100" fill="white"/>
          <text x="10" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0F0F0F">
            Product Name
          </text>
          <text x="10" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
            $199.00
          </text>

          <!-- Product Image Placeholder -->
          <circle cx="160" cy="160" r="60" fill="white" opacity="0.5"/>
        </g>

        <!-- Product 2 -->
        <g transform="translate(360, 0)">
          <rect width="320" height="320" rx="8" fill="#F5F5F5"/>
          <rect y="330" width="320" height="100" fill="white"/>
          <text x="10" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0F0F0F">
            Product Name
          </text>
          <text x="10" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
            $149.00
          </text>

          <circle cx="160" cy="160" r="60" fill="white" opacity="0.5"/>
        </g>

        <!-- Product 3 -->
        <g transform="translate(720, 0)">
          <rect width="320" height="320" rx="8" fill="#F5F5F5"/>
          <rect y="330" width="320" height="100" fill="white"/>
          <text x="10" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0F0F0F">
            Product Name
          </text>
          <text x="10" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
            $249.00
          </text>

          <circle cx="160" cy="160" r="60" fill="white" opacity="0.5"/>
        </g>

        <!-- Product 4 -->
        <g transform="translate(1080, 0)">
          <rect width="270" height="320" rx="8" fill="#F5F5F5"/>
          <rect y="330" width="270" height="100" fill="white"/>
          <text x="10" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0F0F0F">
            Product Name
          </text>
          <text x="10" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
            $179.00
          </text>

          <circle cx="135" cy="160" r="60" fill="white" opacity="0.5"/>
        </g>
      </g>

      <!-- Add to Cart Buttons -->
      <g transform="translate(50, 520)">
        <rect width="320" height="40" rx="20" fill="#0F0F0F"/>
        <rect x="360" width="320" height="40" rx="20" fill="#0F0F0F"/>
        <rect x="720" width="320" height="40" rx="20" fill="#0F0F0F"/>
        <rect x="1080" width="270" height="40" rx="20" fill="#0F0F0F"/>
      </g>
    </g>
  </g>

  <!-- Decorative Elements -->
  <circle cx="1500" cy="100" r="50" fill="#10B981" opacity="0.1"/>
  <circle cx="100" cy="900" r="80" fill="#3B82F6" opacity="0.1"/>
</svg>
