<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#FAFAFA"/>

  <!-- Browser Window -->
  <g transform="translate(100, 100)">
    <!-- Window Chrome -->
    <rect width="1400" height="800" rx="12" fill="white" stroke="#E5E5E5" stroke-width="2"/>
    <rect width="1400" height="40" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="2"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="20" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="20" r="6" fill="#28CA42"/>

    <!-- Address Bar -->
    <rect x="90" y="12" width="1220" height="16" rx="8" fill="white" stroke="#E5E5E5" stroke-width="1"/>
    <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#737373">
      https://example-client.com
    </text>

    <!-- Website Content -->
    <g transform="translate(0, 50)">
      <!-- Header -->
      <rect width="1400" height="60" fill="white"/>
      <text x="50" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0F0F0F">
        BRAND
      </text>
      <rect x="1250" y="20" width="100" height="20" rx="10" fill="#0F0F0F"/>

      <!-- Hero Section -->
      <g transform="translate(50, 100)">
        <text font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="500" fill="#0F0F0F">
          <tspan x="0" y="0">Premium</tspan>
          <tspan x="0" y="80">Brand Identity</tspan>
        </text>

        <!-- Decorative Elements -->
        <rect x="0" y="200" width="400" height="2" fill="#0F0F0F" opacity="0.1"/>
        <circle cx="500" cy="120" r="80" fill="#0F0F0F" opacity="0.03"/>
        <circle cx="650" cy="180" r="120" fill="#0F0F0F" opacity="0.02"/>
      </g>

      <!-- Content Cards -->
      <g transform="translate(50, 450)">
        <rect width="400" height="250" rx="8" fill="#FAFAFA"/>
        <rect x="470" width="400" height="250" rx="8" fill="#FAFAFA"/>
        <rect x="940" width="400" height="250" rx="8" fill="#FAFAFA"/>

        <!-- Card Icons -->
        <circle cx="200" cy="80" r="30" fill="#0F0F0F" opacity="0.05"/>
        <circle cx="670" cy="80" r="30" fill="#0F0F0F" opacity="0.05"/>
        <circle cx="1140" cy="80" r="30" fill="#0F0F0F" opacity="0.05"/>
      </g>
    </g>
  </g>

  <!-- Accent Elements -->
  <rect x="1450" y="50" width="100" height="100" rx="50" fill="#0F0F0F" opacity="0.02"/>
  <rect x="50" y="850" width="150" height="150" rx="75" fill="#0F0F0F" opacity="0.02"/>
</svg>
